# B1 + B2：YUMU 游戏社区 Nginx 站点配置（HTTP 版本，HTTPS 见 yumu-https.conf.example）
# 由 deploy/nginx/Dockerfile 拷入容器 /etc/nginx/conf.d/default.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 上传上限与后端 multipart 保持一致
    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ---- WebSocket（实时通知）----
    location /api/ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ---- 后端 API + 上传文件（context-path 已是 /api）----
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # AI 助手 SSE 流式响应需要长读
        proxy_buffering off;       # SSE 必须关缓冲，否则打字机效果卡住
    }

    # ---- 前端静态资源（Vite 构建产物，带 hash 可长缓存）----
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- SPA history 路由回退 ----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
