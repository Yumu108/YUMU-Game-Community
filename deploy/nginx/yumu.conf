# B1 + B2：YUMU 游戏社区 Nginx 站点配置（HTTP 版本，HTTPS 见 yumu-https.conf.example）
# 由 deploy/nginx/Dockerfile 拷入容器 /etc/nginx/conf.d/default.conf
#
# D5（9-10）加固：
#   ① 边缘限频 limit_req —— 应用层限频之外的第二道闸，拦明显脚本化刷接口的流量；
#   ② 全局安全响应头 —— 见 snippets/security-headers.conf。**注意** Nginx 的 add_header
#      是全有或全无继承：location 里只要自己写了一条 add_header（如 /assets/ 的 Cache-Control），
#      就不再继承 server 级的，所以每个 location 都要显式 include，否则静态资源上的安全头会悄悄消失；
#   ③ server_tokens off —— 不在响应头与错误页暴露 Nginx 版本号。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# D5：边缘限频（limit_req_zone 只能定义在 http 上下文，故写在 conf.d 文件顶层）。
# 30r/s + burst 60：正常页面加载（列表页会并发拉几十张封面图）不会误伤，
# 但足以挡住脚本化高频刷。若上游另有 CDN/WAF 限流，可去掉本行与下方 limit_req 以免双重限流。
limit_req_zone $binary_remote_addr zone=yumu_edge:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    server_tokens off;

    # 上传上限与后端 multipart 保持一致
    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # ---- WebSocket（实时通知）----
    location /api/ws {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ---- 后端 API + 上传文件（context-path 已是 /api）----
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=yumu_edge burst=60 nodelay;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # AI 助手 SSE 流式响应需要长读
        proxy_buffering off;       # SSE 必须关缓冲，否则打字机效果卡住
    }

    # ---- 前端静态资源（Vite 构建产物，带 hash 可长缓存）----
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- SPA history 路由回退 ----
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
