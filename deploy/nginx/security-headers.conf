# ============================================================
# D5（9-10）：Nginx 安全响应头（公共片段）
# ------------------------------------------------------------
# 为什么要单独成文件：
#   Nginx 的 add_header 采用「全有或全无」继承 —— 只要子块（location）里自己
#   写了任意一条 add_header，父块（server）的全部 add_header 就**不再继承**。
#   本站的 /assets/ 需要 `Cache-Control`，因此每个 location 都必须显式 include
#   本文件，否则安全头会在静态资源请求上静默消失（很容易漏掉、且不易发现）。
#
# 使用：server 块与每个 location 块内 `include /etc/nginx/snippets/security-headers.conf;`
# 注意：HSTS（Strict-Transport-Security）只在 HTTPS 站点有效，故不放在本文件，
#      而在 yumu-https.conf.example 的 443 server 中单独声明。
# ============================================================

# 禁止 MIME 嗅探：避免把用户上传的 .jpg 当脚本执行
add_header X-Content-Type-Options "nosniff" always;

# 禁止被第三方站点 iframe 嵌套（防点击劫持）
add_header X-Frame-Options "SAMEORIGIN" always;

# 跨站跳转时只带来源域，不带完整 URL（避免把 token/id 泄给外站）
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 关闭用不到的浏览器能力，缩小攻击面
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

# 内容安全策略：
#   · script-src 'self'      —— 前端为本地打包产物，无内联脚本、无 CDN 依赖；
#   · style-src  ... unsafe-inline —— Element Plus / Vue 会注入内联样式，必须放行；
#   · fonts.googleapis.com / fonts.gstatic.com —— index.html 显式引用了 Google Fonts（Orbitron），
#     不放行会导致字体 404（页面不会白屏，但标题字体回退）；
#   · connect-src 'self' ws: wss: —— 同源 API + SSE + WebSocket 实时通知；
#   · img-src 额外放行 https: —— 帖子封面 / 游戏封面允许引用外链图（社区产品的正常用法）。
#     实测：收紧成 'self' 会让库中已有的外链封面静默裂图；而 <img> 加载 https 图片
#     不存在脚本执行风险（SVG 在 img 中也一样被沙箱化），故放行 https 整体是安全的。
#   · object-src 'none' / base-uri 'self' / frame-ancestors 'self' —— 收敛注入面。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:; media-src 'self' blob: https:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
