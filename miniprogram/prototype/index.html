<h1 data-page-node-id="VWwIBeVYS2aNROu6W1Macl">YUMU 游戏助手 · 小程序原型 v1</h1>
<p class="lead" data-page-node-id="Wq21h4hfvEmX7UIhpRcTFg">游戏社区附带小程序，定位「弱社交、重内容」：以<b data-page-node-id="6ZmCh0x0foxsGhxEhfIeEp">攻略</b>与<b data-page-node-id="kiy4EN2lZdeRdpRzMSKUG5">资讯</b>两条主线替代原社区的互动链路。视觉延续 YUMU 深色 + 电竞紫基调，内容全部来自现有社区的真实数据。</p>
<p class="legend" data-page-node-id="8HplDnFBt9GA720Xhq5TnH">原型只表达页面结构与信息层级，数据为示意。核心亮点是第 4 屏的<b data-page-node-id="oFHq8mcLMXBe7Rm6rWvhA6">攻略步骤卡</b>——把现有长文攻略在前端自动拆成可逐步阅读的卡片，后端零改动。</p>
