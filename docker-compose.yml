# B2：YUMU 游戏社区一键编排 —— mysql / redis / backend / nginx(含前端构建)
# 用法：
#   准备：cp .env.example .env && 填好密钥（MYSQL_ROOT_PASSWORD 等为必填，无默认值）
#   本地开发（只用 mysql/redis）：docker compose up -d mysql redis
#   生产一键部署：docker compose up -d --build
# 密钥全部来自 .env（B4），生产环境禁止把真实密码写进本文件；本文件不设任何弱口令兜底。

# B5：容器日志轮转 —— docker 默认 json-file 无上限，长跑会把磁盘撑爆。
# 统一限制：单文件 10m、保留 3 份（单服务最多 30m）。下面每个服务通过锚点引用。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: yumu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置：请先 cp .env.example .env 并填写}
      MYSQL_DATABASE: yumu_community
      TZ: Asia/Shanghai
    ports:
      # 本机已装 MySQL 占用 3306，容器映射到宿主机 3307 供本地调试；
      # ⚠️ 生产服务器请删除此映射（数据库不应对公网暴露），后端走内网 mysql:3306。
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: yumu-redis
    # 生产如需密码：command 加 --requirepass，并给 backend 传 REDIS_PASSWORD
    ports:
      # ⚠️ 生产服务器建议删除此映射，backend 走内网 redis:6379
      - "6379:6379"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yumu-backend
    # D6（9-10）：异常退出或宿主机重启后自动拉起
    # （配合镜像内的 -XX:+ExitOnOutOfMemoryError —— OOM 时快速退出重启，而不是僵死）
    restart: unless-stopped
    # D6：容器内存上限。与镜像内 -XX:MaxRAMPercentage=75.0 配合 → 堆上限约 750m。
    # 作用：把 OOM 限制在容器内，避免拖垮宿主机；需要更大堆时同时调大本值或覆盖 JAVA_OPTS。
    mem_limit: 1g
    environment:
      # D4（9-10）：容器部署默认走 prod profile —— 触发启动期安全自检（密钥强度 / 限频开关）。
      # 本地想用容器全栈调试且接受弱口令时，可在 .env 里临时设 SPRING_PROFILES_ACTIVE=dev。
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: yumu_community
      DB_USERNAME: ${DB_USERNAME:-root}
      # D4：必填校验，杜绝「生产悄悄跑 123456」
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 未设置：请先 cp .env.example .env 并填写强密码}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置：请先 cp .env.example .env 并填写 >=32 字节随机串}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-7200000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      UPLOAD_DIR: /data/uploads
      # B5：日志落盘到挂载卷（application.yml 的 logging.file.path 读的就是它）
      LOG_DIR: /app/logs
      # 社区智能助手（OpenAI 兼容大模型，默认 DeepSeek；未配 key 时自动走本地 mock 演示）
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_THINKING: ${LLM_THINKING:-false}
      LLM_MOCK: ${LLM_MOCK:-true}
      TZ: Asia/Shanghai
    volumes:
      # A4/B2：上传文件持久化到命名卷，重启/换机不丢（换机迁移时同步该卷）
      # D6：命名卷首次创建时会继承镜像内 /data/uploads 的属主(1000:1000)，无需额外处理
      - uploads_data:/data/uploads
      # B5：应用日志持久化到宿主机 ./logs，方便 grep 排查 + 不随容器销毁丢失
      # ⚠️ D6：容器已改为非 root(uid 1000) 运行，但 bind mount 的权限由**宿主机目录**决定。
      #    首次部署前请执行一次，否则应用写不了日志、启动直接失败：
      #        mkdir -p logs && sudo chown -R 1000:1000 logs
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      # B5：改打 Actuator 健康端点（此前打的是业务接口 /api/system/cache-mode）
      # show-details=never，对外只返回 {"status":"UP"}，不泄露 DB/Redis 细节
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/actuator/health | grep -q '\"UP\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    container_name: yumu-nginx
    ports:
      - "80:80"
      # HTTPS 签发后取消注释，并追加证书挂载（见 deploy/nginx/README.md）：
      # - "443:443"
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # - /var/www/certbot:/var/www/certbot
    volumes:
      # certbot webroot 验证目录（HTTP 版也挂上，方便直接签发）
      - certbot_web:/var/www/certbot
    depends_on:
      - backend
    logging: *default-logging

volumes:
  mysql_data:
  uploads_data:
  certbot_web:
