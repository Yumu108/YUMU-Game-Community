name: CI

# 上线前补齐的工程化项（原 D8 缺口：仓库此前没有任何 CI、backend/src/test 为空）。
# 职责边界：
#   - 本工作流只做「一定能跑通的事」：编译 + 单元测试 + 前端生产构建。
#   - 端到端脚本（tests/*.mjs 60+ 个）依赖 MySQL/Redis + 种子数据，暂不放入 CI，
#     避免在未稳定验证的流水线里产生假红；本地执行方式见 tests/legacy/README.md。
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · 单元测试 + 打包
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn package（含单元测试）
        run: mvn -B -ntp clean package

      - name: 上传 jar 产物
        uses: actions/upload-artifact@v4
        with:
          name: yumu-community-jar
          path: backend/target/yumu-community-1.0.0.jar
          retention-days: 7

  frontend:
    name: 前端 · 生产构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build
